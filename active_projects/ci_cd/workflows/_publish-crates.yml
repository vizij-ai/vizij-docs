name: publish-crates
on:
  workflow_call:
    inputs:
      sequence: { required: true, type: string } # JSON list of crate names in dep order
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: crates-publish
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dry-run all
        run: |
          for c in $(echo '${{ inputs.sequence }}' | jq -r '.[]'); do
            echo "::group::dry-run $c"
            (cd $c && cargo publish --dry-run)
            echo "::endgroup::"
          done
      - name: Publish in order (with verification)
        run: |
          set -euo pipefail
          for c in $(echo '${{ inputs.sequence }}' | jq -r '.[]'); do
            echo "::group::publish $c"
            (cd $c && cargo publish)
            sleep 20
            cargo search "$(cargo metadata --format-version 1 -q | jq -r ".packages[] | select(.name==\"$c\").name")" | head -n1
            echo "::endgroup::"
          done
