name: release
on:
  push:
    tags:
      - 'release/**'
permissions:
  contents: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan-web:
    uses: ./.github/workflows/_release-dry-run.yml
    with: { repo_kind: 'web' }
  plan-rs:
    uses: ./.github/workflows/_release-dry-run.yml
    with: { repo_kind: 'rs' }

  publish-npm:
    needs: [plan-web]
    if: ${{ always() && needs.plan-web.result == 'success' }}
    uses: ./.github/workflows/_publish-npm.yml
    with: { tag: ${{ github.ref_name }} }
    permissions:
      contents: read
      id-token: write
    environment: npm-publish

  publish-crates:
    needs: [plan-rs]
    if: ${{ always() && needs.plan-rs.result == 'success' }}
    uses: ./.github/workflows/_publish-crates.yml
    with:
      sequence: ${{ needs.plan-rs.outputs.publish_plan }}
    environment: crates-publish

  attest:
    name: Create artifact attestations (WASM/archives)
    needs: [publish-npm, publish-crates]
    runs-on: ubuntu-22.04
    permissions:
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v1
